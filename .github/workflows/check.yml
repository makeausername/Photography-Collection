name: Validate portfolio and deployment
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check deployment shell syntax
        run: for script in install.sh deploy.sh update.sh scripts/github-sync.sh; do bash -n "$script"; done
      - name: Build production image
        run: docker build -t kosmoyonder-portfolio:local .
      - name: Initialize and restart a disposable deployment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir .deployment
          printf 'DOMAIN=photos.example.com\nDEPLOYMENT_ID=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\nDEPLOYMENT_SOURCE=%s\n' "$PWD" > .deployment/deploy.env
          compose=(docker compose -p kosmoyonder-ci --env-file .deployment/deploy.env -f deploy/compose.yaml)
          trap '"${compose[@]}" down' EXIT
          "${compose[@]}" config --quiet
          "${compose[@]}" run --rm --no-deps initialize
          "${compose[@]}" up -d --wait --wait-timeout 120 portfolio
          "${compose[@]}" restart portfolio
          "${compose[@]}" up -d --wait --wait-timeout 120 portfolio
          "${compose[@]}" exec -T portfolio node -e "fetch('http://127.0.0.1:4173/api/session').then(r=>r.json()).then(d=>{if(d.setupRequired)process.exit(1)})"
          DOMAIN=localhost "${compose[@]}" run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
